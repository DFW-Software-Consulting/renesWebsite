<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--app-head-->
    <noscript>
      <style>
        /* Without JS, motion's entrance states (opacity 0 / offset) never animate in. Show content in its final state. */
        :is([style*='opacity:0'], [style*='transform:translate']):not([aria-hidden='true'], [aria-hidden='true'] *) {
          opacity: 1 !important;
          transform: none !important;
        }
        [style*='clip-path:inset']:not([aria-hidden='true']) {
          clip-path: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
